<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transactions</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .header h1 {
      margin: 0;
      font-size: 28px;
    }
    .btn {
      background: linear-gradient(to right, #2563eb, #4f46e5);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .filters {
      background: white;
      border-radius: 12px;
      padding: 15px 20px;
      margin-bottom: 30px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .filters button {
      margin: 0 5px;
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }
    .filters .active {
      background: #dbeafe;
      color: #2563eb;
      font-weight: bold;
    }
    .transaction-list {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .transaction {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      border-bottom: 1px solid #eee;
    }
    .transaction:last-child {
      border-bottom: none;
    }
    .details {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .income-icon {
      background: #dcfce7;
      color: #16a34a;
    }
    .expense-icon {
      background: #fee2e2;
      color: #dc2626;
    }
    .amount {
      font-weight: bold;
      font-size: 16px;
      text-align: right;
    }
    .income {
      color: #16a34a;
    }
    .expense {
      color: #dc2626;
    }
    .delete-btn {
      background: none;
      border: none;
      color: gray;
      cursor: pointer;
      margin-left: 10px;
    }
    .delete-btn:hover {
      color: #dc2626;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div>
      <h1>Transactions</h1>
      <p>Track your income and expenses</p>
    </div>
    <button class="btn">+ Add Transaction</button>
  </div>

  <!-- Filters -->
  <div class="filters">
    <strong>Filter:</strong>
    <button class="active">All</button>
    <button>Income</button>
    <button>Expenses</button>
  </div>

  <!-- Transactions List -->
  <div class="transaction-list">
    <div class="transaction">
      <div class="details">
        <div class="icon income-icon">💳</div>
        <div>
          <strong>Salary</strong><br>
          <small>Income • Sep 5, 2025</small>
        </div>
      </div>
      <div>
        <div class="amount income">+ $3,000</div>
        <button class="delete-btn">🗑</button>
      </div>
    </div>

    <div class="transaction">
      <div class="details">
        <div class="icon expense-icon">💳</div>
        <div>
          <strong>Groceries</strong><br>
          <small>Food • Sep 7, 2025</small>
        </div>
      </div>
      <div>
        <div class="amount expense">- $120</div>
        <button class="delete-btn">🗑</button>
      </div>
    </div>

    <div class="transaction">
      <div class="details">
        <div class="icon expense-icon">💳</div>
        <div>
          <strong>Electricity Bill</strong><br>
          <small>Utilities • Sep 9, 2025</small>
        </div>
      </div>
      <div>
        <div class="amount expense">- $90</div>
        <button class="delete-btn">🗑</button>
      </div>
    </div>
  </div>

</body>
</html>
