<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .header h1 {
      margin: 0;
      font-size: 28px;
    }
    .btn {
      background: linear-gradient(to right, #2563eb, #4f46e5);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .card h3 {
      margin: 0;
      font-size: 14px;
      color: gray;
    }
    .card p {
      font-size: 22px;
      font-weight: bold;
      margin-top: 8px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .section h2 {
      margin: 0 0 15px 0;
      font-size: 18px;
    }
    .transaction, .category {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
    .income { color: green; }
    .expense { color: red; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>Dashboard</h1>
      <p>Welcome back, User</p>
    </div>
    <button class="btn">+ Add Transaction</button>
  </div>

  <!-- Summary Cards -->
  <div class="cards">
    <div class="card">
      <h3>Total Income</h3>
      <p class="income">$5,000</p>
    </div>
    <div class="card">
      <h3>Total Expenses</h3>
      <p class="expense">$2,200</p>
    </div>
    <div class="card">
      <h3>Balance</h3>
      <p>$2,800</p>
    </div>
  </div>

  <div class="grid-2">
    <!-- Recent Transactions -->
    <div class="section">
      <h2>Recent Transactions</h2>
      <div class="transaction">
        <span>Salary (Income)</span>
        <span class="income">+ $3,000</span>
      </div>
      <div class="transaction">
        <span>Groceries</span>
        <span class="expense">- $150</span>
      </div>
      <div class="transaction">
        <span>Electricity Bill</span>
        <span class="expense">- $90</span>
      </div>
    </div>

    <!-- Category Spending -->
    <div class="section">
      <h2>Category Spending</h2>
      <div class="category">
        <span>Food</span>
        <span>$500</span>
      </div>
      <div class="category">
        <span>Rent</span>
        <span>$1,200</span>
      </div>
      <div class="category">
        <span>Entertainment</span>
        <span>$200</span>
      </div>
    </div>
  </div>

</body>
</html>
